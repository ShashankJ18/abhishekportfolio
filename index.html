<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Embed Test — sWlDdHMO59w</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b1115;
      color: #e9edf2;
      margin: 0;
      padding: 30px;
      text-align: center;
    }

    h1 {
      margin-bottom: 12px;
    }

    #thumb {
      width: 560px;
      max-width: 92%;
      height: 315px;
      background-size: cover;
      background-position: center;
      border-radius: 10px;
      cursor: pointer;
      margin: 20px auto;
      position: relative;
      box-shadow: 0 6px 30px rgba(0,0,0,0.5);
    }

    #thumb .play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #f7d300;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #000;
      font-size: 34px;
      font-weight: bold;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }

    iframe {
      width: 560px;
      max-width: 92%;
      height: 315px;
      border: none;
      display: none;
      border-radius: 10px;
      box-shadow: 0 6px 30px rgba(0,0,0,0.6);
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      background: #f7d300;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      color: #000;
    }
  </style>
</head>

<body>

  <h1>YouTube Embed Test</h1>
  <p>Video ID: <b>sWlDdHMO59w</b></p>

  <!-- Thumbnail -->
  <div id="thumb"
       style="background-image:url('https://img.youtube.com/vi/sWlDdHMO59w/hqdefault.jpg')">
    <div class="play">▶</div>
  </div>

  <!-- Actual iframe -->
  <iframe id="player"
    src=""
    title="YouTube video player"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; autoplay"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen>
  </iframe>

  <button onclick="openYT()">Open on YouTube</button>

  <script>
    const videoId = "sWlDdHMO59w";
    const iframe = document.getElementById("player");
    const thumb = document.getElementById("thumb");

    function playVideo() {
      console.log("Loading video...");

      const url =
        "https://www.youtube.com/embed/" +
        videoId +
        "?autoplay=1&mute=1&rel=0";

      iframe.src = url;
      iframe.style.display = "block";
      thumb.style.display = "none";
    }

    function openYT() {
      window.open("https://youtube.com/watch?v=" + videoId, "_blank");
    }

    thumb.addEventListener("click", playVideo);
  </script>
</body>
</html>
